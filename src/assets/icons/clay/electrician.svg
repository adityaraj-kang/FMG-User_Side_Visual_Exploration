<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" width="52" height="52">
  <defs>
    <radialGradient id="elecBg" cx="40%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#FFE8A3"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </radialGradient>
    <filter id="elecShadow" x="-10%" y="-5%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
      <feOffset dx="0" dy="2" result="shifted"/>
      <feFlood flood-color="#000000" flood-opacity="0.18"/>
      <feComposite in2="shifted" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Soft clay circle -->
  <circle cx="26" cy="25" r="22" fill="url(#elecBg)" filter="url(#elecShadow)"/>
  <!-- Lightning bolt — plump rounded form -->
  <path d="M29.5,10 L19,26.5 L24.5,26.5 L22.5,40 L33,23 L27.5,23 Z"
        fill="#FFFFFF"
        stroke="#FFFFFF"
        stroke-width="1.2"
        stroke-linejoin="round"
        stroke-linecap="round"/>
</svg>
