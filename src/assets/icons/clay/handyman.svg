<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" width="52" height="52">
  <defs>
    <radialGradient id="hamBg" cx="40%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#FFD4A3"/>
      <stop offset="100%" stop-color="#FFB74D"/>
    </radialGradient>
    <filter id="hamShadow" x="-10%" y="-5%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
      <feOffset dx="0" dy="2" result="shifted"/>
      <feFlood flood-color="#000000" flood-opacity="0.18"/>
      <feComposite in2="shifted" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Soft clay circle -->
  <circle cx="26" cy="25" r="22" fill="url(#hamBg)" filter="url(#hamShadow)"/>
  <!-- Hammer — plump rounded forms -->
  <g fill="#FFFFFF" transform="translate(26,25) rotate(-30) translate(-26,-25)">
    <!-- Handle -->
    <rect x="23" y="22" width="6" height="20" rx="3" ry="3"/>
    <!-- Head -->
    <rect x="16" y="14" width="20" height="10" rx="4" ry="4"/>
    <!-- Claw notch -->
    <ellipse cx="19" cy="14.5" rx="2" ry="3" fill="url(#hamBg)" opacity="0.35"/>
  </g>
</svg>
