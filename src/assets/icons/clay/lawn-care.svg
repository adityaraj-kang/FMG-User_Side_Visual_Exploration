<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" width="52" height="52">
  <defs>
    <radialGradient id="lawnBg" cx="40%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#C5E8C9"/>
      <stop offset="100%" stop-color="#A5D6A7"/>
    </radialGradient>
    <filter id="lawnShadow" x="-10%" y="-5%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
      <feOffset dx="0" dy="2" result="shifted"/>
      <feFlood flood-color="#000000" flood-opacity="0.18"/>
      <feComposite in2="shifted" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Soft clay circle -->
  <circle cx="26" cy="25" r="22" fill="url(#lawnBg)" filter="url(#lawnShadow)"/>
  <!-- Tree / leaf — plump rounded forms -->
  <g fill="#FFFFFF">
    <!-- Trunk -->
    <rect x="23.5" y="30" width="5" height="9" rx="2.5" ry="2.5"/>
    <!-- Canopy — three overlapping plump circles -->
    <circle cx="26" cy="18" r="7"/>
    <circle cx="20" cy="23" r="6"/>
    <circle cx="32" cy="23" r="6"/>
    <!-- Leaf vein hint -->
    <ellipse cx="26" cy="20" rx="3" ry="5" fill="url(#lawnBg)" opacity="0.2"/>
  </g>
</svg>
