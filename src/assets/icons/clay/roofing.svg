<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" width="52" height="52">
  <defs>
    <radialGradient id="roofBg" cx="40%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#D6DCE0"/>
      <stop offset="100%" stop-color="#B0BEC5"/>
    </radialGradient>
    <filter id="roofShadow" x="-10%" y="-5%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
      <feOffset dx="0" dy="2" result="shifted"/>
      <feFlood flood-color="#000000" flood-opacity="0.18"/>
      <feComposite in2="shifted" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Soft clay circle -->
  <circle cx="26" cy="25" r="22" fill="url(#roofBg)" filter="url(#roofShadow)"/>
  <!-- House / roof — plump rounded forms -->
  <g fill="#FFFFFF">
    <!-- House body -->
    <rect x="16" y="25" width="20" height="13" rx="3" ry="3"/>
    <!-- Roof -->
    <path d="M12,27 L26,13 L40,27 Z"
          fill="#FFFFFF"
          stroke="#FFFFFF"
          stroke-width="2"
          stroke-linejoin="round"
          stroke-linecap="round"/>
    <!-- Door -->
    <rect x="23" y="30" width="6" height="8" rx="2" ry="2" fill="url(#roofBg)" opacity="0.4"/>
    <!-- Window left -->
    <rect x="18" y="27.5" width="4" height="4" rx="1.5" ry="1.5" fill="url(#roofBg)" opacity="0.35"/>
    <!-- Window right -->
    <rect x="30" y="27.5" width="4" height="4" rx="1.5" ry="1.5" fill="url(#roofBg)" opacity="0.35"/>
    <!-- Chimney -->
    <rect x="32" y="15" width="4" height="8" rx="1.5" ry="1.5"/>
  </g>
</svg>
