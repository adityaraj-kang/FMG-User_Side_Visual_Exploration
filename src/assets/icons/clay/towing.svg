<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" width="52" height="52">
  <defs>
    <radialGradient id="towBg" cx="40%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#FFB3B3"/>
      <stop offset="100%" stop-color="#FF7B7B"/>
    </radialGradient>
    <filter id="towShadow" x="-10%" y="-5%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
      <feOffset dx="0" dy="2" result="shifted"/>
      <feFlood flood-color="#000000" flood-opacity="0.18"/>
      <feComposite in2="shifted" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Soft clay circle -->
  <circle cx="26" cy="25" r="22" fill="url(#towBg)" filter="url(#towShadow)"/>
  <!-- Truck body — plump rounded shapes -->
  <g fill="#FFFFFF">
    <!-- Cab -->
    <rect x="13" y="20" width="12" height="11" rx="3.5" ry="3.5"/>
    <!-- Bed -->
    <rect x="24" y="17" width="16" height="14" rx="3.5" ry="3.5"/>
    <!-- Left wheel -->
    <circle cx="18" cy="33" r="3" fill="#FFFFFF"/>
    <circle cx="18" cy="33" r="1.5" fill="url(#towBg)"/>
    <!-- Right wheel -->
    <circle cx="35" cy="33" r="3" fill="#FFFFFF"/>
    <circle cx="35" cy="33" r="1.5" fill="url(#towBg)"/>
    <!-- Window -->
    <rect x="15" y="22" width="8" height="5" rx="2" ry="2" fill="url(#towBg)" opacity="0.45"/>
  </g>
</svg>
