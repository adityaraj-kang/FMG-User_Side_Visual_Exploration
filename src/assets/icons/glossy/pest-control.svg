<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="pest-shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="pest-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CC5DE8"/>
      <stop offset="100%" stop-color="#9C36B5"/>
    </linearGradient>
    <radialGradient id="pest-gloss" cx="0.35" cy="0.25" r="0.7" fx="0.3" fy="0.2">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pest-depth" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="56" height="56" rx="14" ry="14" fill="url(#pest-bg)" filter="url(#pest-shadow)"/>
  <rect x="4" y="4" width="56" height="56" rx="14" ry="14" fill="url(#pest-depth)"/>
  <rect x="4" y="4" width="56" height="56" rx="14" ry="14" fill="url(#pest-gloss)"/>

  <!-- Bug icon (white) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bug head -->
    <circle cx="32" cy="22" r="5" fill="#FFFFFF" stroke="none"/>
    <!-- Bug body (oval) -->
    <ellipse cx="32" cy="36" rx="10" ry="12" fill="#FFFFFF" stroke="none"/>
    <!-- Body center line -->
    <line x1="32" y1="26" x2="32" y2="48" stroke="#9C36B5" stroke-width="2"/>
    <!-- Body horizontal stripes -->
    <line x1="23" y1="32" x2="41" y2="32" stroke="#9C36B5" stroke-width="1.5"/>
    <line x1="24" y1="38" x2="40" y2="38" stroke="#9C36B5" stroke-width="1.5"/>
    <!-- Antennae -->
    <path d="M28 19c-3-4-7-5-10-3" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M36 19c3-4 7-5 10-3" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Antenna tips -->
    <circle cx="18" cy="16" r="1.5" fill="#FFFFFF" stroke="none"/>
    <circle cx="46" cy="16" r="1.5" fill="#FFFFFF" stroke="none"/>
    <!-- Legs - left side -->
    <line x1="22" y1="30" x2="15" y2="26"/>
    <line x1="22" y1="36" x2="14" y2="36"/>
    <line x1="23" y1="42" x2="15" y2="46"/>
    <!-- Legs - right side -->
    <line x1="42" y1="30" x2="49" y2="26"/>
    <line x1="42" y1="36" x2="50" y2="36"/>
    <line x1="41" y1="42" x2="49" y2="46"/>
    <!-- Eyes -->
    <circle cx="29" cy="21" r="1.5" fill="#9C36B5" stroke="none"/>
    <circle cx="35" cy="21" r="1.5" fill="#9C36B5" stroke="none"/>
  </g>
</svg>
