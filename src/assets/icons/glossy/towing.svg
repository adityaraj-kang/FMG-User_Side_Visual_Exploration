<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Drop shadow -->
    <filter id="tow-shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <!-- Background gradient (coral-red) -->
    <linearGradient id="tow-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#CC4444"/>
    </linearGradient>
    <!-- Glossy highlight -->
    <radialGradient id="tow-gloss" cx="0.35" cy="0.25" r="0.7" fx="0.3" fy="0.2">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Inner depth gradient -->
    <linearGradient id="tow-depth" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect with shadow -->
  <rect x="4" y="4" width="56" height="56" rx="14" ry="14" fill="url(#tow-bg)" filter="url(#tow-shadow)"/>
  <!-- Inner depth -->
  <rect x="4" y="4" width="56" height="56" rx="14" ry="14" fill="url(#tow-depth)"/>
  <!-- Glossy specular highlight -->
  <rect x="4" y="4" width="56" height="56" rx="14" ry="14" fill="url(#tow-gloss)"/>

  <!-- Tow truck icon (white) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Truck cab -->
    <path d="M16 38V26h18v12"/>
    <!-- Cab roof -->
    <path d="M34 26l6 6v6h6v-6l-4-8h-8"/>
    <!-- Truck bed / flatbed -->
    <line x1="16" y1="38" x2="46" y2="38"/>
    <!-- Tow hook arm -->
    <path d="M16 26l-2-6"/>
    <circle cx="13" cy="18" r="2" fill="#FFFFFF" stroke="none"/>
    <!-- Front wheel -->
    <circle cx="23" cy="41" r="3.5" fill="#CC4444" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Rear wheel -->
    <circle cx="41" cy="41" r="3.5" fill="#CC4444" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Wheel axle dots -->
    <circle cx="23" cy="41" r="1" fill="#FFFFFF" stroke="none"/>
    <circle cx="41" cy="41" r="1" fill="#FFFFFF" stroke="none"/>
  </g>
</svg>
