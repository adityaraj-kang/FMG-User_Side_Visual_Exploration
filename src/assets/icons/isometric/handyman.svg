<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28">
  <!-- Isometric Hammer: T-shape blocks, head + handle -->
  <!-- Handle - top face -->
  <polygon points="12,13 15,11 17,12 14,14" fill="#E0E0E0"/>
  <!-- Handle - right face -->
  <polygon points="17,12 14,14 14,24 17,22" fill="#9E9E9E"/>
  <!-- Handle - left face -->
  <polygon points="12,13 14,14 14,24 12,23" fill="#BDBDBD"/>
  <!-- Head block - top face -->
  <polygon points="5,9 14,4 23,9 14,14" fill="#E0E0E0"/>
  <!-- Head block - left face -->
  <polygon points="5,9 14,14 14,17 5,12" fill="#BDBDBD"/>
  <!-- Head block - right face -->
  <polygon points="23,9 14,14 14,17 23,12" fill="#9E9E9E"/>
  <!-- Head block - striking face (green accent) -->
  <polygon points="19,6 23,9 23,12 19,9" fill="#00FF88"/>
  <!-- Head top bevel -->
  <polygon points="5,9 9,7 14,10 10,12" fill="#BDBDBD"/>
  <!-- Claw side detail -->
  <polygon points="5,9 8,7 8,10 5,12" fill="#9E9E9E"/>
</svg>