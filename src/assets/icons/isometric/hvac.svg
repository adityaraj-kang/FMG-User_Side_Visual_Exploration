<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28">
  <!-- Isometric Snowflake/Fan: hexagonal geometric crystal -->
  <!-- Center hexagon -->
  <polygon points="14,6 20,9 20,15 14,18 8,15 8,9" fill="#E0E0E0"/>
  <!-- Top-right facet -->
  <polygon points="14,6 20,9 18,10 14,8" fill="#BDBDBD"/>
  <!-- Right facet -->
  <polygon points="20,9 20,15 18,14 18,10" fill="#9E9E9E"/>
  <!-- Bottom-right facet -->
  <polygon points="20,15 14,18 14,16 18,14" fill="#BDBDBD"/>
  <!-- Top arm -->
  <polygon points="13,6 15,6 15,3 13,3" fill="#BDBDBD"/>
  <polygon points="13,3 15,3 16,2 12,2" fill="#E0E0E0"/>
  <!-- Top-right arm (green accent) -->
  <polygon points="20,9 23,7 24,8 21,10" fill="#00FF88"/>
  <!-- Bottom-right arm -->
  <polygon points="20,15 23,17 22,18 19,16" fill="#9E9E9E"/>
  <!-- Bottom arm -->
  <polygon points="13,18 15,18 15,21 13,21" fill="#BDBDBD"/>
  <polygon points="12,22 16,22 15,21 13,21" fill="#9E9E9E"/>
  <!-- Bottom-left arm -->
  <polygon points="8,15 5,17 6,18 9,16" fill="#BDBDBD"/>
  <!-- Top-left arm -->
  <polygon points="8,9 5,7 4,8 7,10" fill="#9E9E9E"/>
  <!-- Center dot -->
  <polygon points="13,11 15,11 15,13 13,13" fill="#9E9E9E"/>
</svg>