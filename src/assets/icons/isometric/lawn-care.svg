<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28">
  <!-- Isometric Tree: triangular canopy + rectangular trunk on ground plane -->
  <!-- Ground shadow -->
  <polygon points="8,24 20,24 22,25 6,25" fill="#9E9E9E"/>
  <!-- Trunk - front face -->
  <polygon points="13,17 15,17 15,24 13,24" fill="#BDBDBD"/>
  <!-- Trunk - right face -->
  <polygon points="15,17 17,16 17,23 15,24" fill="#9E9E9E"/>
  <!-- Trunk - top face -->
  <polygon points="13,17 15,17 17,16 15,16" fill="#E0E0E0"/>
  <!-- Canopy - left face -->
  <polygon points="14,3 6,17 14,17" fill="#BDBDBD"/>
  <!-- Canopy - right face -->
  <polygon points="14,3 22,17 14,17" fill="#9E9E9E"/>
  <!-- Canopy - top ridge (green accent) -->
  <polygon points="14,3 16,4 22,17 20,18 14,5 8,18 6,17" fill="#00FF88"/>
  <!-- Canopy layered depth - second tier -->
  <polygon points="14,8 9,17 14,17" fill="#E0E0E0"/>
  <!-- Canopy layered depth - second tier right -->
  <polygon points="14,8 19,17 14,17" fill="#BDBDBD"/>
</svg>