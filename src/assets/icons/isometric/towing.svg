<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28">
  <!-- Isometric Tow Truck: cab + bed + wheels -->
  <!-- Truck bed - top face -->
  <polygon points="10,8 22,8 24,10 12,10" fill="#E0E0E0"/>
  <!-- Truck bed - right face -->
  <polygon points="22,8 24,10 24,16 22,14" fill="#9E9E9E"/>
  <!-- Truck bed - left face -->
  <polygon points="10,8 12,10 12,16 10,14" fill="#BDBDBD"/>
  <!-- Truck bed - front face -->
  <polygon points="12,10 24,10 24,16 12,16" fill="#BDBDBD"/>
  <!-- Cab - top face -->
  <polygon points="4,10 10,10 12,12 6,12" fill="#E0E0E0"/>
  <!-- Cab - right face -->
  <polygon points="10,10 12,12 12,18 10,16" fill="#9E9E9E"/>
  <!-- Cab - left face -->
  <polygon points="4,10 6,12 6,18 4,16" fill="#BDBDBD"/>
  <!-- Cab - front face (green accent) -->
  <polygon points="6,12 12,12 12,18 6,18" fill="#00FF88"/>
  <!-- Left wheel -->
  <polygon points="6,18 9,18 9,21 6,21" fill="#9E9E9E"/>
  <!-- Right wheel -->
  <polygon points="19,16 22,16 22,19 19,19" fill="#9E9E9E"/>
  <!-- Wheel axle line - left -->
  <polygon points="5,19 10,19 10,20 5,20" fill="#BDBDBD"/>
  <!-- Wheel axle line - right -->
  <polygon points="18,17 23,17 23,18 18,18" fill="#BDBDBD"/>
</svg>