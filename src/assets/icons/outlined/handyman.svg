<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <defs>
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>
  </defs>
  <!-- Hammer head — top block -->
  <rect x="22" y="8" width="28" height="14" rx="2" fill="none" stroke="url(#wireGrad)" stroke-width="2"/>
  <!-- Claw notch on left side -->
  <path d="M22 14 L16 8 L14 10 L20 18" fill="none" stroke="url(#wireGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hammer face line on right -->
  <line x1="50" y1="10" x2="50" y2="20" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Handle -->
  <rect x="33" y="22" width="6" height="38" rx="2" fill="none" stroke="url(#wireGrad)" stroke-width="2"/>
  <!-- Handle grip texture lines -->
  <line x1="33" y1="46" x2="39" y2="46" fill="none" stroke="url(#wireGrad)" stroke-width="1" stroke-linecap="round"/>
  <line x1="33" y1="50" x2="39" y2="50" fill="none" stroke="url(#wireGrad)" stroke-width="1" stroke-linecap="round"/>
  <line x1="33" y1="54" x2="39" y2="54" fill="none" stroke="url(#wireGrad)" stroke-width="1" stroke-linecap="round"/>
  <!-- Handle end cap -->
  <rect x="31" y="58" width="10" height="4" rx="1" fill="none" stroke="url(#wireGrad)" stroke-width="1.5"/>
  <!-- Nail detail to the right -->
  <line x1="56" y1="28" x2="56" y2="42" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="53" y1="28" x2="59" y2="28" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
