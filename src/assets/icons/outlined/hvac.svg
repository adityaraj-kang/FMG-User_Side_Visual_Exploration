<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <defs>
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>
  </defs>
  <!-- Snowflake: 6 main arms radiating from center -->
  <!-- Vertical arm -->
  <line x1="36" y1="8" x2="36" y2="64" fill="none" stroke="url(#wireGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Top-right to bottom-left arm -->
  <line x1="60.28" y1="22" x2="11.72" y2="50" fill="none" stroke="url(#wireGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Top-left to bottom-right arm -->
  <line x1="11.72" y1="22" x2="60.28" y2="50" fill="none" stroke="url(#wireGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Branch details on vertical arm (top) -->
  <line x1="36" y1="16" x2="30" y2="22" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="16" x2="42" y2="22" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Branch details on vertical arm (bottom) -->
  <line x1="36" y1="56" x2="30" y2="50" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="56" x2="42" y2="50" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Branch details on top-right arm -->
  <line x1="52" y1="26.6" x2="52" y2="18.6" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="26.6" x2="56.9" y2="31.5" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Branch details on bottom-left arm -->
  <line x1="20" y1="45.4" x2="20" y2="53.4" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="45.4" x2="15.1" y2="40.5" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Branch details on top-left arm -->
  <line x1="20" y1="26.6" x2="20" y2="18.6" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="26.6" x2="15.1" y2="31.5" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Branch details on bottom-right arm -->
  <line x1="52" y1="45.4" x2="52" y2="53.4" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="45.4" x2="56.9" y2="40.5" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center diamond -->
  <polygon points="36,30 42,36 36,42 30,36" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
