<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <defs>
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>
  </defs>
  <!-- Shield outline -->
  <path d="M36 6 L58 16 L58 38 Q58 56 36 66 Q14 56 14 38 L14 16 Z" fill="none" stroke="url(#wireGrad)" stroke-width="2" stroke-linejoin="round"/>
  <!-- Bug body — oval abdomen -->
  <ellipse cx="36" cy="44" rx="8" ry="10" fill="none" stroke="url(#wireGrad)" stroke-width="2"/>
  <!-- Bug thorax — smaller oval -->
  <ellipse cx="36" cy="32" rx="5" ry="4" fill="none" stroke="url(#wireGrad)" stroke-width="2"/>
  <!-- Bug head -->
  <circle cx="36" cy="26" r="3" fill="none" stroke="url(#wireGrad)" stroke-width="2"/>
  <!-- Antennae -->
  <path d="M34 23 Q30 16 26 14" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M38 23 Q42 16 46 14" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Antenna tips -->
  <circle cx="26" cy="14" r="1" fill="none" stroke="url(#wireGrad)" stroke-width="1.5"/>
  <circle cx="46" cy="14" r="1" fill="none" stroke="url(#wireGrad)" stroke-width="1.5"/>
  <!-- Left legs -->
  <line x1="28" y1="36" x2="22" y2="32" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="42" x2="20" y2="42" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="48" x2="22" y2="52" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right legs -->
  <line x1="44" y1="36" x2="50" y2="32" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="42" x2="52" y2="42" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="48" x2="50" y2="52" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Wing line detail on abdomen -->
  <line x1="36" y1="34" x2="36" y2="54" fill="none" stroke="url(#wireGrad)" stroke-width="1" stroke-linecap="round"/>
</svg>
