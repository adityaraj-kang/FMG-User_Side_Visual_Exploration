<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <defs>
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>
  </defs>
  <!-- House roof (triangle) -->
  <polygon points="36,8 64,36 8,36" fill="none" stroke="url(#wireGrad)" stroke-width="2" stroke-linejoin="round"/>
  <!-- Roof overhang -->
  <line x1="4" y1="36" x2="68" y2="36" fill="none" stroke="url(#wireGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- House body -->
  <rect x="14" y="36" width="44" height="28" fill="none" stroke="url(#wireGrad)" stroke-width="2"/>
  <!-- Door -->
  <rect x="30" y="46" width="12" height="18" rx="1" fill="none" stroke="url(#wireGrad)" stroke-width="2"/>
  <!-- Door knob -->
  <circle cx="39" cy="56" r="1.5" fill="none" stroke="url(#wireGrad)" stroke-width="1.5"/>
  <!-- Left window -->
  <rect x="18" y="42" width="8" height="8" rx="1" fill="none" stroke="url(#wireGrad)" stroke-width="1.5"/>
  <!-- Left window cross -->
  <line x1="22" y1="42" x2="22" y2="50" fill="none" stroke="url(#wireGrad)" stroke-width="1"/>
  <line x1="18" y1="46" x2="26" y2="46" fill="none" stroke="url(#wireGrad)" stroke-width="1"/>
  <!-- Right window -->
  <rect x="46" y="42" width="8" height="8" rx="1" fill="none" stroke="url(#wireGrad)" stroke-width="1.5"/>
  <!-- Right window cross -->
  <line x1="50" y1="42" x2="50" y2="50" fill="none" stroke="url(#wireGrad)" stroke-width="1"/>
  <line x1="46" y1="46" x2="54" y2="46" fill="none" stroke="url(#wireGrad)" stroke-width="1"/>
  <!-- Chimney -->
  <rect x="48" y="14" width="8" height="22" fill="none" stroke="url(#wireGrad)" stroke-width="2"/>
  <!-- Chimney cap -->
  <line x1="46" y1="14" x2="58" y2="14" fill="none" stroke="url(#wireGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Roof shingle lines -->
  <line x1="22" y1="28" x2="50" y2="28" fill="none" stroke="url(#wireGrad)" stroke-width="1" stroke-linecap="round"/>
  <line x1="28" y1="20" x2="44" y2="20" fill="none" stroke="url(#wireGrad)" stroke-width="1" stroke-linecap="round"/>
</svg>
