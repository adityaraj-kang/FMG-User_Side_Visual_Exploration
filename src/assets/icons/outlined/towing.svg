<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <defs>
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>
  </defs>
  <!-- Truck cab -->
  <rect x="8" y="28" width="22" height="20" rx="2" fill="none" stroke="url(#wireGrad)" stroke-width="2"/>
  <!-- Windshield -->
  <line x1="24" y1="28" x2="30" y2="20" fill="none" stroke="url(#wireGrad)" stroke-width="2"/>
  <!-- Truck hood/engine -->
  <path d="M30 20 L42 20 L42 48 L30 48 L30 28" fill="none" stroke="url(#wireGrad)" stroke-width="2"/>
  <!-- Flatbed / tow platform -->
  <rect x="42" y="30" width="22" height="18" rx="1" fill="none" stroke="url(#wireGrad)" stroke-width="2"/>
  <!-- Tow hook arm -->
  <path d="M56 30 L56 22 L62 22" fill="none" stroke="url(#wireGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Tow hook -->
  <path d="M62 22 L64 22 L64 26 L60 26" fill="none" stroke="url(#wireGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Flatbed ramp lines -->
  <line x1="64" y1="48" x2="68" y2="54" fill="none" stroke="url(#wireGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Front wheel -->
  <circle cx="20" cy="52" r="6" fill="none" stroke="url(#wireGrad)" stroke-width="2"/>
  <circle cx="20" cy="52" r="2" fill="none" stroke="url(#wireGrad)" stroke-width="1.5"/>
  <!-- Rear wheel -->
  <circle cx="52" cy="52" r="6" fill="none" stroke="url(#wireGrad)" stroke-width="2"/>
  <circle cx="52" cy="52" r="2" fill="none" stroke="url(#wireGrad)" stroke-width="1.5"/>
  <!-- Axle line -->
  <line x1="8" y1="48" x2="64" y2="48" fill="none" stroke="url(#wireGrad)" stroke-width="2"/>
</svg>
